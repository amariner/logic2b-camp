name: check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check types, lint and builds
        run: pnpm exec turbo run typecheck lint build
      # API, demo and onboarding start local workerd runtimes. Running their
      # test tasks concurrently can crash workerd on the two-core hosted runner.
      - name: Run tests without competing workerd runtimes
        run: pnpm exec turbo run test --concurrency=1
