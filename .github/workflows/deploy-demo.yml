name: deploy-demo
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    # Producción de tenants reales: SIEMPRE manual (workflow aparte, Fase 9). Esto solo toca la demo.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build web (tenant demo)
        if: ${{ vars.DEPLOY_DEMO_ENABLED == 'true' }}
        run: pnpm --filter @logic-camp/web build
        env:
          TENANT: demo
      - name: Build dashboard (→ /admin/)
        if: ${{ vars.DEPLOY_DEMO_ENABLED == 'true' }}
        run: |
          pnpm --filter @logic-camp/dashboard build
          rm -rf apps/web/dist/admin && cp -r apps/dashboard/dist apps/web/dist/admin
      - name: Deploy demo worker (web + API)
        if: ${{ vars.DEPLOY_DEMO_ENABLED == 'true' }}
        working-directory: apps/api
        run: pnpm exec wrangler deploy --config ../../tenants/demo/wrangler.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Skip notice
        if: ${{ vars.DEPLOY_DEMO_ENABLED != 'true' }}
        run: echo "Deploy demo desactivado — configura secrets CLOUDFLARE_* y la variable DEPLOY_DEMO_ENABLED=true"
